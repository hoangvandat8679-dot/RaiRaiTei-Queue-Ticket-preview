name: Deploy preview từ repo này

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "preview-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã từ nhánh main (repo preview)
        uses: actions/checkout@v4

      - name: Chuẩn bị Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Cài dependency V2
        run: npm ci --prefix ./v2

      - name: Kiểm tra và build V2
        run: npm --prefix ./v2 run build

      - name: Chuẩn bị GitHub Pages
        uses: actions/configure-pages@v5

      - name: Đóng gói website preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2/dist

      - name: Xuất bản preview
        id: deployment
        uses: actions/deploy-pages@v4
